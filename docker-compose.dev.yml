services:
  app:
    container_name: kontrol-isp-app
    user: "root"
    ports:
      - "${PORT}:${PORT}"
    environment:
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - AUTH_TRUST_HOST=true
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - EMAIL_SERVER_HOST=${EMAIL_SERVER_HOST}
      - EMAIL_SERVER_PORT=${EMAIL_SERVER_PORT}
      - EMAIL_SERVER_USER=${EMAIL_SERVER_USER}
      - EMAIL_SERVER_PASSWORD=${EMAIL_SERVER_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - NEXT_PUBLIC_APP_VERSION=${PROD_DEPLOY_TAG:-1.0.1}
      - NEXT_PUBLIC_ENABLE_AI_CHAT=${NEXT_PUBLIC_ENABLE_AI_CHAT:-true}
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      - AI_API_KEY=${AI_API_KEY}
      - ISP_AI_PROVIDER=${ISP_AI_PROVIDER:-openai}
      - ISP_AI_API_KEY=${ISP_AI_API_KEY}
      - ISP_AI_MODEL=${ISP_AI_MODEL:-gpt-4o-mini}
      - ISP_AI_HISTORY_LIMIT=${ISP_AI_HISTORY_LIMIT:-10}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - dev_app_vol:/app
      - /app/.next
    command: sh -c "npm install && npx prisma generate && npm run dev"
    networks:
      - dev-network

networks:
  dev-network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-dev-network}

volumes:
  dev_app_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/services/app
